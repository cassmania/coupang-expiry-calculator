<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="제조일자와 유효기간으로 유통기한을 계산하는 간단한 계산기">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23e52528'/><text x='32' y='44' text-anchor='middle' font-size='38' font-family='Arial' font-weight='700' fill='white'>C</text></svg>">
    <title>쿠팡 유통기한 계산기</title>

    <style>
        :root {
            color-scheme: light;
            --background: #f6f8fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #dfe3e8;
            --red: #e52528;
            --orange: #f47b20;
            --yellow: #f9c20a;
            --green: #45a735;
            --blue: #0096d6;
            --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: var(--text);
            background: var(--background);
        }

        button,
        input {
            font: inherit;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e8ebef;
            box-shadow: 0 2px 12px rgba(31, 41, 55, 0.06);
            backdrop-filter: blur(10px);
        }

        .header-content {
            width: min(100% - 32px, 420px);
            margin: 0 auto;
            padding: 18px 0 16px;
            text-align: center;
        }

        /* 외부 이미지 대신 글자로 구성하여 GitHub Pages에서도 로고가 깨지지 않습니다. */
        .brand-logo {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.09em;
            text-transform: lowercase;
            user-select: none;
        }

        .brand-logo span:nth-child(1),
        .brand-logo span:nth-child(2) { color: var(--red); }
        .brand-logo span:nth-child(3) { color: var(--orange); }
        .brand-logo span:nth-child(4) { color: var(--yellow); }
        .brand-logo span:nth-child(5) { color: var(--green); }
        .brand-logo span:nth-child(6),
        .brand-logo span:nth-child(7) { color: var(--blue); }

        .title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        main {
            width: min(100% - 32px, 420px);
            flex: 1;
            margin: 0 auto;
            padding: 28px 0 32px;
        }

        .input-card,
        .result-card,
        .empty-state {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .input-card {
            padding: 20px;
            margin-bottom: 16px;
        }

        .label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #374151;
        }

        .label svg {
            flex: 0 0 auto;
            color: var(--red);
        }

        .date-input,
        .number-input {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            border: 1px solid #cfd5dd;
            border-radius: 10px;
            color: var(--text);
            background: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .date-input:focus,
        .number-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 150, 214, 0.14);
        }

        .number-input {
            padding-right: 44px;
        }

        .input-group {
            position: relative;
        }

        .unit {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            color: var(--muted);
            font-weight: 600;
            pointer-events: none;
        }

        .date-display {
            margin-top: 9px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .result-card {
            padding: 20px;
            border-width: 2px;
        }

        .result-header {
            margin-bottom: 14px;
            text-align: center;
        }

        .result-label,
        .expiry-day,
        .summary-label {
            color: var(--muted);
        }

        .result-label {
            margin-bottom: 4px;
            font-size: 0.78rem;
        }

        .expiry-date {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .expiry-day {
            margin-top: 3px;
            font-size: 0.8rem;
        }

        .status-box {
            margin-bottom: 14px;
            padding: 10px;
            border-radius: 9px;
            text-align: center;
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .summary-item {
            padding: 10px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #ffffff;
            text-align: center;
        }

        .summary-label {
            margin-bottom: 3px;
            font-size: 0.75rem;
        }

        .summary-value {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-reset,
        .btn-copy {
            min-height: 44px;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .btn-reset {
            border: 1px solid #cfd5dd;
            color: #374151;
            background: #ffffff;
        }

        .btn-copy {
            border: 1px solid var(--red);
            color: #ffffff;
            background: var(--red);
        }

        .btn-reset:hover,
        .btn-copy:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(31, 41, 55, 0.12);
        }

        .btn-reset:focus-visible,
        .btn-copy:focus-visible {
            outline: 3px solid rgba(0, 150, 214, 0.28);
            outline-offset: 2px;
        }

        .empty-state {
            padding: 34px 20px;
            border-style: dashed;
            border-width: 2px;
            box-shadow: none;
            text-align: center;
        }

        .empty-icon {
            margin-bottom: 12px;
            color: #a3aab4;
        }

        .empty-text {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.65;
        }

        .copy-message {
            min-height: 24px;
            margin-top: 10px;
            color: #087443;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
        }

        footer {
            width: 100%;
            padding: 22px 16px 24px;
            border-top: 1px solid #e8ebef;
            background: #ffffff;
            text-align: center;
        }

        .footer-guide {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        /* 원본 하단 안내의 12px보다 정확히 2배 큰 24px로 표시합니다. */
        .made-by {
            font-size: 24px;
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: -0.04em;
        }

        .made-by .red { color: var(--red); }
        .made-by .orange { color: var(--orange); }
        .made-by .yellow { color: #d99c00; }
        .made-by .green { color: var(--green); }
        .made-by .blue { color: var(--blue); }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            .header-content,
            main {
                width: min(100% - 24px, 420px);
            }

            .brand-logo {
                font-size: 1.8rem;
            }

            .title {
                font-size: 1.25rem;
            }

            main {
                padding-top: 18px;
            }

            .input-card,
            .result-card {
                padding: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand-logo" aria-label="Coupang">
                <span>c</span><span>o</span><span>u</span><span>p</span><span>a</span><span>n</span><span>g</span>
            </div>
            <h1 class="title">유통기한 계산기</h1>
        </div>
    </header>

    <main>
        <section class="input-card" aria-labelledby="manufactureLabel">
            <label class="label" id="manufactureLabel" for="manufactureDate">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                제조일자
            </label>
            <input type="date" id="manufactureDate" class="date-input">
            <p id="dateDisplay" class="date-display" hidden></p>
        </section>

        <section class="input-card" aria-labelledby="shelfLifeLabel">
            <label class="label" id="shelfLifeLabel" for="shelfLifeDays">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12,6 12,12 16,14"></polyline>
                </svg>
                유효기간 (일수)
            </label>
            <div class="input-group">
                <input type="number" id="shelfLifeDays" class="number-input" placeholder="유효기간 일수 입력" min="1" step="1" inputmode="numeric">
                <span class="unit" aria-hidden="true">일</span>
            </div>
        </section>

        <section id="resultContainer" aria-live="polite" hidden></section>

        <section id="emptyState" class="empty-state">
            <svg class="empty-icon" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12,6 12,12 16,14"></polyline>
            </svg>
            <p class="empty-text">
                제조일자와 유효기간을 입력하면<br>
                유통기한이 자동으로 계산됩니다
            </p>
        </section>
    </main>

    <footer>
        <p class="footer-guide">홈 화면에 추가하여 앱처럼 사용하세요</p>
        <p class="made-by" aria-label="made by 김기범">
            <span class="red">made</span>
            <span class="orange">by</span>
            <span class="yellow">김</span><span class="green">기</span><span class="blue">범</span>
        </p>
    </footer>

    <script>
        // 화면에서 사용할 입력창과 결과 영역을 한 번만 찾아 보관합니다.
        const manufactureDateInput = document.getElementById("manufactureDate");
        const shelfLifeDaysInput = document.getElementById("shelfLifeDays");
        const dateDisplay = document.getElementById("dateDisplay");
        const resultContainer = document.getElementById("resultContainer");
        const emptyState = document.getElementById("emptyState");

        // YYYY-MM-DD 문자열을 사용자의 현지 날짜로 변환해 시간대에 따른 날짜 오차를 막습니다.
        function parseLocalDate(dateValue) {
            const [year, month, day] = dateValue.split("-").map(Number);
            return new Date(year, month - 1, day);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            const weekdays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

            return `${year}년 ${month}월 ${day}일 (${weekdays[date.getDay()]})`;
        }

        function formatShortDate(date) {
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${month}/${day}`;
        }

        // 남은 일수에 따라 결과 카드의 안내 문구와 색상을 결정합니다.
        function getStatusStyle(daysUntilExpiry) {
            if (daysUntilExpiry < 0) {
                return {
                    text: "유통기한이 지났습니다",
                    background: "#fef2f2",
                    color: "#c81e1e",
                    border: "#fecaca"
                };
            }

            if (daysUntilExpiry <= 7) {
                return {
                    text: `유통기한까지 ${daysUntilExpiry}일 남음`,
                    background: "#fffbea",
                    color: "#b65d00",
                    border: "#fde68a"
                };
            }

            return {
                text: `유통기한까지 ${daysUntilExpiry}일 남음`,
                background: "#effcf5",
                color: "#087443",
                border: "#a7f3d0"
            };
        }

        function hideResult() {
            resultContainer.hidden = true;
            resultContainer.innerHTML = "";
            emptyState.hidden = false;
        }

        function displayResult(expiryDate, daysUntilExpiry, manufactureDate, shelfLifeDays) {
            const status = getStatusStyle(daysUntilExpiry);
            const formattedExpiry = formatDate(expiryDate);
            const [expiryText, weekdayText] = formattedExpiry.split(" (");

            resultContainer.innerHTML = `
                <div class="result-card" style="background: ${status.background}; border-color: ${status.border};">
                    <div class="result-header">
                        <p class="result-label">유통기한</p>
                        <p class="expiry-date">${expiryText}</p>
                        <p class="expiry-day">(${weekdayText}</p>
                    </div>

                    <div class="status-box" style="background: ${status.background};">
                        <p class="status-text" style="color: ${status.color};">${status.text}</p>
                    </div>

                    <div class="summary-grid">
                        <div class="summary-item">
                            <p class="summary-label">제조일자</p>
                            <p class="summary-value">${formatShortDate(manufactureDate)}</p>
                        </div>
                        <div class="summary-item">
                            <p class="summary-label">유효기간</p>
                            <p class="summary-value">${shelfLifeDays}일</p>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button type="button" class="btn-reset" id="resetButton">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                            초기화
                        </button>
                        <button type="button" class="btn-copy" id="copyButton">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            복사하기
                        </button>
                    </div>
                    <p class="copy-message" id="copyMessage" aria-live="polite"></p>
                </div>
            `;

            resultContainer.hidden = false;
            emptyState.hidden = true;

            document.getElementById("resetButton").addEventListener("click", resetForm);
            document.getElementById("copyButton").addEventListener("click", copyResult);
        }

        // 제조일자를 첫날로 포함하므로 제조일자 + 유효기간 - 1일을 결과로 계산합니다.
        function calculateExpiry() {
            const manufactureDateValue = manufactureDateInput.value;
            const shelfLifeDays = Number.parseInt(shelfLifeDaysInput.value, 10);

            if (!manufactureDateValue || !Number.isInteger(shelfLifeDays) || shelfLifeDays < 1) {
                hideResult();
                return;
            }

            const manufactureDate = parseLocalDate(manufactureDateValue);
            const expiryDate = new Date(manufactureDate);
            expiryDate.setDate(expiryDate.getDate() + shelfLifeDays - 1);

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dayInMilliseconds = 1000 * 60 * 60 * 24;
            const daysUntilExpiry = Math.round((expiryDate.getTime() - today.getTime()) / dayInMilliseconds);

            displayResult(expiryDate, daysUntilExpiry, manufactureDate, shelfLifeDays);
        }

        function resetForm() {
            manufactureDateInput.value = "";
            shelfLifeDaysInput.value = "";
            dateDisplay.textContent = "";
            dateDisplay.hidden = true;
            hideResult();
            manufactureDateInput.focus();
        }

        async function copyResult() {
            const manufactureDateValue = manufactureDateInput.value;
            const shelfLifeDays = Number.parseInt(shelfLifeDaysInput.value, 10);
            const manufactureDate = parseLocalDate(manufactureDateValue);
            const expiryDate = new Date(manufactureDate);
            const copyMessage = document.getElementById("copyMessage");

            expiryDate.setDate(expiryDate.getDate() + shelfLifeDays - 1);

            const resultText = [
                `제조일자: ${formatDate(manufactureDate).split(" (")[0]}`,
                `유효기간: ${shelfLifeDays}일`,
                `유통기한: ${formatDate(expiryDate).split(" (")[0]}`
            ].join("\n");

            try {
                await navigator.clipboard.writeText(resultText);
                copyMessage.textContent = "결과를 클립보드에 복사했습니다.";
            } catch (error) {
                copyMessage.textContent = "복사할 수 없습니다. 브라우저 권한을 확인해 주세요.";
            }
        }

        manufactureDateInput.addEventListener("change", () => {
            if (manufactureDateInput.value) {
                dateDisplay.textContent = formatDate(parseLocalDate(manufactureDateInput.value));
                dateDisplay.hidden = false;
            } else {
                dateDisplay.textContent = "";
                dateDisplay.hidden = true;
            }

            calculateExpiry();
        });

        shelfLifeDaysInput.addEventListener("input", calculateExpiry);
        hideResult();
    </script>
</body>
</html>
