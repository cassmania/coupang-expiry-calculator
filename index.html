<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="제조일자와 유효기간으로 유통기한을 계산하는 간단한 계산기">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="유통기한 계산기">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23e52528'/><text x='32' y='44' text-anchor='middle' font-size='38' font-family='Arial' font-weight='700' fill='white'>C</text></svg>">
    <title>쿠팡 유통기한 계산기</title>

    <style>
        :root {
            color-scheme: light;
            --background: #f6f8fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #dfe3e8;
            --red: #e52528;
            --orange: #f47b20;
            --yellow: #f9c20a;
            --green: #45a735;
            --blue: #0096d6;
            --logo-burgundy: #521110;
            --logo-red: #d73227;
            --logo-orange: #e99923;
            --logo-green: #92ba3e;
            --logo-blue: #50a3d9;
            --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: var(--text);
            background: var(--background);
        }

        button,
        input {
            font: inherit;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e8ebef;
            box-shadow: 0 2px 12px rgba(31, 41, 55, 0.06);
            backdrop-filter: blur(10px);
        }

        .header-content {
            width: min(100% - 32px, 420px);
            margin: 0 auto;
            padding: 18px 0 16px;
            text-align: center;
        }

        /* 외부 이미지 대신 글자로 구성하여 GitHub Pages에서도 로고가 깨지지 않습니다. */
        .brand-logo {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 16px;
            font-family: "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif;
            font-size: 4.75rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            text-transform: lowercase;
            user-select: none;
        }

        .brand-logo span:nth-child(1),
        .brand-logo span:nth-child(2) { color: var(--logo-burgundy); }
        .brand-logo span:nth-child(3),
        .brand-logo span:nth-child(4) { color: var(--logo-red); }
        .brand-logo span:nth-child(5) { color: var(--logo-orange); }
        .brand-logo span:nth-child(6) { color: var(--logo-green); }
        .brand-logo span:nth-child(7) { color: var(--logo-blue); }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        main {
            width: min(100% - 32px, 420px);
            flex: 1;
            margin: 0 auto;
            padding: 28px 0 32px;
        }

        .input-card,
        .result-card,
        .empty-state {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .input-card {
            padding: 20px;
            margin-bottom: 16px;
        }

        .label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #374151;
        }

        .label svg {
            flex: 0 0 auto;
            color: var(--red);
        }

        .date-input,
        .number-input {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            border: 1px solid #cfd5dd;
            border-radius: 10px;
            color: var(--text);
            background: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .date-input:focus,
        .number-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 150, 214, 0.14);
        }

        .number-input {
            padding-right: 44px;
        }

        .input-group {
            position: relative;
        }

        .unit {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            color: var(--muted);
            font-weight: 600;
            pointer-events: none;
        }

        .date-display {
            margin-top: 9px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .result-card {
            padding: 20px;
            border-width: 2px;
        }

        .result-header {
            margin-bottom: 14px;
            text-align: center;
        }

        .result-label,
        .expiry-day,
        .summary-label {
            color: var(--muted);
        }

        .result-label {
            margin-bottom: 4px;
            font-size: 0.78rem;
        }

        .expiry-date {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .expiry-day {
            margin-top: 3px;
            font-size: 0.8rem;
        }

        .status-box {
            margin-bottom: 14px;
            padding: 10px;
            border-radius: 9px;
            text-align: center;
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .summary-item {
            padding: 10px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #ffffff;
            text-align: center;
        }

        .summary-label {
            margin-bottom: 3px;
            font-size: 0.75rem;
        }

        .summary-value {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-reset,
        .btn-copy {
            min-height: 44px;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .btn-reset {
            border: 1px solid #cfd5dd;
            color: #374151;
            background: #ffffff;
        }

        .btn-copy {
            border: 1px solid var(--red);
            color: #ffffff;
            background: var(--red);
        }

        .btn-reset:hover,
        .btn-copy:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(31, 41, 55, 0.12);
        }

        .btn-reset:focus-visible,
        .btn-copy:focus-visible {
            outline: 3px solid rgba(0, 150, 214, 0.28);
            outline-offset: 2px;
        }

        .empty-state {
            padding: 34px 20px;
            border-style: dashed;
            border-width: 2px;
            box-shadow: none;
            text-align: center;
        }

        .empty-icon {
            margin-bottom: 12px;
            color: #a3aab4;
        }

        .empty-text {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.65;
        }

        .copy-message {
            min-height: 24px;
            margin-top: 10px;
            color: #087443;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
        }

        .copy-message:empty {
            display: none;
        }

        footer {
            width: 100%;
            padding: 22px 16px 24px;
            border-top: 1px solid #e8ebef;
            background: #ffffff;
            text-align: center;
        }

        .install-button {
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            /* 아래 제작자 문구와 정확히 약 1cm 간격을 둡니다. */
            margin-bottom: 1cm;
            padding: 4px 14px;
            border: 1px solid #e7a5a1;
            border-radius: 999px;
            color: #8d211a;
            background: #fff8f7;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .install-button:hover {
            border-color: var(--logo-red);
            background: #fff1f0;
        }

        .install-button:focus-visible,
        .dialog-action:focus-visible,
        .dialog-close:focus-visible {
            outline: 3px solid rgba(0, 150, 214, 0.28);
            outline-offset: 2px;
        }

        .install-dialog-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.5);
        }

        .install-dialog-card {
            width: min(100%, 380px);
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            padding: 22px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
            text-align: left;
        }

        .install-dialog-card h2 {
            margin-bottom: 12px;
            font-size: 1.2rem;
            text-align: center;
        }

        .install-steps {
            margin: 0 0 14px;
            padding-left: 22px;
            color: #4b5563;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .dialog-actions {
            display: grid;
            gap: 8px;
            margin-bottom: 8px;
        }

        .dialog-action,
        .dialog-close {
            width: 100%;
            min-height: 44px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .dialog-action {
            border: 1px solid var(--logo-red);
            color: var(--logo-red);
            background: #fff8f7;
        }

        .dialog-action.primary {
            border-color: var(--logo-red);
            color: #ffffff;
            background: var(--logo-red);
        }

        .install-action-message {
            margin: 0 0 10px;
            color: #166534;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
        }

        .dialog-close {
            border: 1px solid #d1d5db;
            color: #374151;
            background: #ffffff;
        }

        /* 원본 하단 안내의 12px보다 정확히 2배 큰 24px로 표시합니다. */
        .made-by {
            font-size: 24px;
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: -0.04em;
        }

        .made-by .red { color: var(--red); }
        .made-by .orange { color: var(--orange); }
        .made-by .yellow { color: #d99c00; }
        .made-by .green { color: var(--green); }
        .made-by .blue { color: var(--blue); }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                min-height: 100dvh;
            }

            .header-content,
            main {
                width: min(100% - 24px, 420px);
            }

            .header-content {
                padding: 10px 0 9px;
            }

            .brand-logo {
                margin-bottom: 6px;
                font-size: 3.25rem;
            }

            .title {
                font-size: 1.75rem;
                line-height: 1.15;
            }

            main {
                padding: 10px 0 8px;
            }

            .input-card,
            .result-card {
                padding: 12px;
            }

            .input-card {
                margin-bottom: 8px;
            }

            .label {
                margin-bottom: 6px;
            }

            .date-input,
            .number-input {
                height: 44px;
            }

            .date-display {
                margin-top: 4px;
                font-size: 0.78rem;
            }

            .result-header {
                margin-bottom: 6px;
            }

            .expiry-date {
                font-size: 1.4rem;
            }

            .status-box {
                margin-bottom: 8px;
                padding: 6px;
            }

            .summary-grid {
                gap: 8px;
                margin-bottom: 8px;
            }

            .summary-item {
                padding: 6px;
            }

            footer {
                padding: 8px 12px 10px;
            }

            .install-button {
                min-height: 28px;
                margin-bottom: 1cm;
                padding: 2px 12px;
                font-size: 0.7rem;
            }

            .install-dialog-backdrop {
                align-items: end;
                padding: 12px;
            }

            .install-dialog-card {
                padding: 18px;
                border-radius: 18px 18px 12px 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand-logo" aria-label="Coupang">
                <span>c</span><span>o</span><span>u</span><span>p</span><span>a</span><span>n</span><span>g</span>
            </div>
            <h1 class="title">유통기한 계산기</h1>
        </div>
    </header>

    <main>
        <section class="input-card" aria-labelledby="manufactureLabel">
            <label class="label" id="manufactureLabel" for="manufactureDate">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                제조일자
            </label>
            <input type="date" id="manufactureDate" class="date-input">
            <p id="dateDisplay" class="date-display" hidden></p>
        </section>

        <section class="input-card" aria-labelledby="shelfLifeLabel">
            <label class="label" id="shelfLifeLabel" for="shelfLifeDays">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12,6 12,12 16,14"></polyline>
                </svg>
                유효기간 (일수)
            </label>
            <div class="input-group">
                <input type="number" id="shelfLifeDays" class="number-input" placeholder="유효기간 일수 입력" min="1" step="1" inputmode="numeric">
                <span class="unit" aria-hidden="true">일</span>
            </div>
        </section>

        <section id="resultContainer" aria-live="polite" hidden></section>

        <section id="emptyState" class="empty-state">
            <svg class="empty-icon" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12,6 12,12 16,14"></polyline>
            </svg>
            <p class="empty-text">
                제조일자와 유효기간을 입력하면<br>
                유통기한이 자동으로 계산됩니다
            </p>
        </section>
    </main>

    <footer>
        <button type="button" class="install-button" id="installButton">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 3v12"></path>
                <path d="m7 10 5 5 5-5"></path>
                <path d="M5 21h14"></path>
            </svg>
            <span id="installButtonLabel">홈 화면에 추가</span>
        </button>
        <p class="made-by" aria-label="made by 김기범">
            <span class="red">made</span>
            <span class="orange">by</span>
            <span class="yellow">김</span><span class="green">기</span><span class="blue">범</span>
        </p>
    </footer>

    <div class="install-dialog-backdrop" id="installDialog" hidden>
        <section class="install-dialog-card" role="dialog" aria-modal="true" aria-labelledby="installDialogTitle">
            <h2 id="installDialogTitle">홈 화면에 추가</h2>
            <ol class="install-steps" id="installSteps"></ol>
            <div class="dialog-actions">
                <button type="button" class="dialog-action primary" id="externalBrowserButton" hidden>Chrome으로 열기</button>
                <button type="button" class="dialog-action" id="copyPageLinkButton" hidden>링크 복사</button>
            </div>
            <p class="install-action-message" id="installActionMessage" role="status" aria-live="polite" hidden></p>
            <button type="button" class="dialog-close" id="closeInstallDialog">확인</button>
        </section>
    </div>

    <script src="./app.js" defer></script>
</body>
</html>
